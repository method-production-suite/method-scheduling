# Method Schedule's feature list: the single source for the feature section of README.md
# and the feature list on the website (site/index.html).
#
# After editing, regenerate both:
#
#     python3 scripts/site.py
#
# CI runs `python3 scripts/site.py --check`, which fails when README.md or the site no
# longer match this file. How it all fits together: docs/WEBSITE.md.
#
# Fields
#   [[group]]    id, title. Groups appear in the order written here.
#   [[feature]]  group    the id of a group above
#                title    a few words, no trailing period
#                text     one sentence, user-facing, ends with a period
#                status   "have" (built) or "soon" (planned)
#                ref      optional: parity rows ("BRK-07", the id column of
#                         docs/parity/features.csv) and decisions ("D44", an entry of
#                         docs/decisions.md), as a string or a list. A "have" feature
#                         needs at least one ref, and every parity row it names must be
#                         `have`: the list never claims something that isn't built.
#
# [project] repo is the source repository's URL. It is written into the site's links
# (every <a href=... data-repo="path">) and the README's clone command, so moving the
# repository is a one-line edit here plus a regenerate.
#
# Write for someone who schedules films, not for someone who reads the code. No em
# dashes, no vendor or product names (the clean-room statement and the FAQ are the only
# places those go). Inline `code` is allowed; nothing else is markup.

[project]
repo = "https://github.com/method-production-suite/method-scheduling"

[[group]]
id = "breakdown"
title = "Breakdown"

[[group]]
id = "board"
title = "Board"

[[group]]
id = "dood"
title = "Day out of days"

[[group]]
id = "calendar"
title = "Calendar and events"

[[group]]
id = "reports"
title = "Reports and exports"

[[group]]
id = "files"
title = "Files and safety"

[[group]]
id = "keys"
title = "Keyboard and command line"

[[group]]
id = "beyond"
title = "Beyond the usual stripboard"

