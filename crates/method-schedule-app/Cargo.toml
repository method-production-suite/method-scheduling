[package]
name = "method-schedule-app"
description = "Scheduling desktop app (Tauri): edit schedules in a native window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "method_schedule_app"
path = "src/lib.rs"

[[bin]]
name = "method-schedule-app"
path = "src/main.rs"

# Tauri crates pinned exactly, at the versions and features Method Budget uses
# (docs/APP.md, "Dependencies"). No updater plugin until the repository is public.
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
method-schedule-core = { path = "../method-schedule-core" }
method-schedule-format = { path = "../method-schedule-format" }
# The window-free session (docs/research/web-session.md), with the system clock: a
# desktop build without it would run on a stopped clock (src/app.rs installs it).
method-schedule-session = { path = "../method-schedule-session", features = ["std-clock"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", default-features = false, features = ["wry", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-dialog = "=2.7.3"
# In-app updates (src/updater.rs, decision 213), Method Budget's versions: the plugin
# fetches latest.json and checks its minisign signature; reqwest (already in the build
# through the plugin) gives its redirect rule; semver compares versions for What's New.
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false }
semver = "=1.0.28"
