[package]
name = "method-schedule-session"
description = "Method Schedule's open schedules without a window: sessions, undo, edits, views and the command contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Builds for wasm32-unknown-unknown as well as the desktop: no file system,
# no threads and no clock of its own (src/clock.rs). `cargo xtask
# wasm-check` and CI check it (docs/research/web-session.md, decision 222).

[dependencies]
method-schedule-core = { path = "../method-schedule-core" }
method-schedule-format = { path = "../method-schedule-format" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
# The system clock as the default (src/clock.rs): for the desktop, never for
# a browser build, where std's clock panics.
std-clock = []
