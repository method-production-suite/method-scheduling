[package]
name = "method-schedule-format"
description = "Native schedule file format: versioned, diff-friendly JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# serde only, pinned to the versions Method Budget uses (decisions.md, entry 3).
[dependencies]
method-schedule-core = { path = "../method-schedule-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# The engine's seeded generators for the fuzz and property tests: no new crate
# (decision 172).
[dev-dependencies]
method-schedule-core = { path = "../method-schedule-core", features = ["testgen"] }

