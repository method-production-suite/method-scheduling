[package]
name = "method-schedule-web"
description = "Method Schedule in a browser: method-schedule-session as WebAssembly, with a JS API and the page's invoke shim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Built for wasm32-unknown-unknown only (`cargo xtask web`,
# docs/research/web-session.md, phase 2). On the desktop the crate holds
# only a name helper and pulls in nothing new, so `cargo build` and
# `cargo test --workspace` stay as they were.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
method-schedule-session = { path = "../method-schedule-session" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "=1.0.151"
# Both already in Cargo.lock through Tauri: no newer version is taken.
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
