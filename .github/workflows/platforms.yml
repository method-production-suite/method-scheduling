# The nightly (SUITE-STANDARDS.md section 6, "Lean CI"): pull requests run Linux-only
# checks (ci.yml); the full test run on macOS, Windows and Linux happens once a night on
# main, and on every release (release.yml builds all three). A night when main hasn't
# moved since the last green nightly is skipped. Run by hand with workflow_dispatch.
# Least privilege; actions pinned to full commit SHAs.
name: platforms
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
# A run by hand (say, on release day) waits for the night's run rather than cancelling it.
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    # Skips the night when main's HEAD is the commit the last green nightly tested. A run
    # by hand always goes ahead.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.last.outputs.run }}
    steps:
      - name: The last green nightly's commit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/platforms.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still $GITHUB_SHA, which the last green nightly tested: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config libgtk-3-dev
      - name: Test
        run: cargo test --workspace --locked
