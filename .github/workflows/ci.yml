# Least privilege by default. Pin all actions to full commit SHAs (pinact run).
name: ci
# The quick dependency checks only (SUITE-STANDARDS.md section 6, "CI, ArtCraft-style"):
# a pull request and a push to main run `cooldown` and `deny`, the two checks the ruleset
# requires, and nothing else. The session runs the full check on this Mac before marking a
# pull request ready (`cargo xtask ci`, pasted under "Tested locally"); the weekly full build
# (platforms.yml) builds and tests on macOS, Windows and Linux; every release builds all
# three (release.yml). A draft runs nothing until it is marked ready, and a newer push
# cancels an older run.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cooldown:
    # Fails a pull request that adds crates published less than 14 days ago, and a push
    # to main when any crate in the lock is that young (crate-ages.yml also checks the
    # whole lock weekly, for anything that slipped in).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A pull request: the crates it adds, against main. Main: the whole lock, so
          # nothing already in it goes unchecked.
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/check-crate-ages.py --only-changed origin/main
          else
            python3 scripts/check-crate-ages.py
          fi
  deny:
    # deny.toml: known advisories, licenses compatible with MIT OR Apache-2.0, crates.io
    # as the only source; and THIRD-PARTY-NOTICES.md current with Cargo.lock (decision 209).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Third-party notices are up to date
        run: |
          cargo fetch --locked
          python3 scripts/notices.py --check
