# Release builds on a version tag (decisions.md, entries 196 and 210): the app bundled with
# the Tauri bundler for macOS on Apple silicon (.dmg), Windows (NSIS setup .exe) and Linux
# (.deb and AppImage), under version-free names so the website can link
# releases/latest/download/<file>, attached to a draft GitHub release for a person to read
# over and publish. Nothing is published by this workflow.
#
#   Method-Schedule-macOS.dmg               Method-Schedule-linux-amd64.deb
#   Method-Schedule-windows-x64-setup.exe   Method-Schedule-linux-x86_64.AppImage
#
# Signing uses the suite's secret names (Method Budget's), so one 1Password item feeds every
# repository. Each signing step is skipped without its secrets; the build is the same
# otherwise (ad-hoc signed on the Mac, unsigned on Windows):
#   macOS signing:     DEVELOPER_ID_CERT_P12_BASE64 (the Developer ID Application .p12,
#                      base64), CERT_PASSWORD, KEYCHAIN_PASSWORD (any new password for the
#                      runner's throwaway keychain). The identity is the one the .p12 holds.
#   macOS notarizing:  AC_API_KEY_ID, AC_API_ISSUER_ID, AC_API_KEY_P8_BASE64 (an App Store
#                      Connect API key, the .p8 base64); needs the signing secrets too.
#   Updates (macOS):   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the
#                      minisign key in 1Password, "Method Schedule updater key"). With
#                      them, and a public key in tauri.conf.json, the Mac build also makes
#                      the signed updater archive and the draft gets latest.json
#                      (scripts/update-manifest.py; decision 213). Without, no manifest:
#                      installed apps don't see the release.
#   Windows signing:   WINDOWS_CERTIFICATE (a code signing .pfx, base64),
#                      WINDOWS_CERTIFICATE_PASSWORD. The suite's model step; no certificate
#                      exists yet, so the first Windows alpha ships unsigned.
#
# Least privilege: only the draft job writes. First-party actions only, pinned to full
# commit SHAs; no caches (release builds start clean).
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build, such as v0.1.0"
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAURI_CLI_VERSION: "2.11.4"
jobs:
  check:
    name: tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag matches the version in Cargo.toml, on main
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          version="$(awk '/^\[workspace.package\]/{p=1; next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/, "", $0); sub(/version=/, "", $0); print; exit}' Cargo.toml)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::The tag $tag is not v$version, the version in Cargo.toml."
            exit 1
          fi
          # A tag on a side branch must not build a release.
          if ! git merge-base --is-ancestor "$(git rev-list -n 1 "$tag")" origin/main; then
            echo "::error::$tag points at a commit that is not on main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only (the suite standard); Intel Macs keep the version they have.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            target: ""
            bundles: nsis
          - name: linux-x64
            # The oldest supported Ubuntu keeps the AppImage's glibc requirement low.
            os: ubuntu-22.04
            target: ""
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Which optional secrets exist (true or false), never their values.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' && secrets.CERT_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_NOTARY_KEY: ${{ secrets.AC_API_KEY_ID != '' && secrets.AC_API_ISSUER_ID != '' && secrets.AC_API_KEY_P8_BASE64 != '' }}
      HAS_WIN_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config libgtk-3-dev file
      - name: Add the Rust target
        if: matrix.target != ''
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Tauri CLI
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"

      - name: Decide what gets signed
        run: |
          set -euo pipefail
          sign=no; notarize=no; updater=no
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_DEVELOPER_ID" = true ]; then
            sign=yes
            if [ "$HAS_NOTARY_KEY" = true ]; then notarize=yes; fi
          fi
          # The updater archive: macOS only, with the private key, and only when the app
          # trusts a public key (without one it would refuse every update anyway).
          pubkey="$(python3 -c 'import json; print(json.load(open("crates/method-schedule-app/tauri.conf.json"))["plugins"]["updater"]["pubkey"].strip())')"
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_UPDATER_KEY" = true ] && [ -n "$pubkey" ]; then updater=yes; fi
          echo "Developer ID signing: $sign. Notarizing: $notarize. Updater archive: $updater."
          if [ "$RUNNER_OS" = macOS ] && [ "$updater" = no ]; then
            echo "::notice::No updater archive: the updater key secret or the app's public key is missing (decision 213)."
          fi
          if [ "$RUNNER_OS" = macOS ] && [ "$sign" = no ]; then
            echo "::notice::No Developer ID secrets: the macOS build is ad-hoc signed and not notarized."
          fi
          { echo "MACOS_SIGN=$sign"; echo "MACOS_NOTARIZE=$notarize"; echo "UPDATER=$updater"; } >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'yes'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # Search this keychain first, keeping the existing ones.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          # The identity is the Developer ID Application the .p12 holds; its name stays out
          # of the repository.
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate holds no Developer ID Application identity."
            exit 1
          fi
          echo "::add-mask::$identity"
          { echo "APPLE_SIGNING_IDENTITY=$identity"; echo "SIGNING_KEYCHAIN=$keychain"; } >> "$GITHUB_ENV"

      - name: Prepare the notarization key (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes'
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build bundles
        working-directory: crates/method-schedule-app
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          # Read by the Tauri CLI only when set; empty values are unset below.
          NOTARY_KEY_ID: ${{ runner.os == 'macOS' && secrets.AC_API_KEY_ID || '' }}
          NOTARY_ISSUER: ${{ runner.os == 'macOS' && secrets.AC_API_ISSUER_ID || '' }}
          UPDATER_PRIVATE_KEY: ${{ runner.os == 'macOS' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          CI: "true"
        run: |
          set -euo pipefail
          args=(build --bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          # The Tauri CLI notarizes and staples the app when these are set, and signs with a
          # real identity only when APPLE_SIGNING_IDENTITY is set.
          if [ "${MACOS_NOTARIZE:-no}" = yes ]; then
            export APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_ISSUER="$NOTARY_ISSUER"
          fi
          # The updater archive and its signature.
          if [ "${UPDATER:-no}" = yes ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_PRIVATE_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_PRIVATE_KEY_PASSWORD"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          unset NOTARY_KEY_ID NOTARY_ISSUER UPDATER_PRIVATE_KEY UPDATER_PRIVATE_KEY_PASSWORD
          cargo tauri "${args[@]}" -- --locked

      - name: Sign, notarize and staple the disk image (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes'
        env:
          TARGET: ${{ matrix.target }}
          NOTARY_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for dmg in "target/$TARGET/release/bundle/dmg/"*.dmg; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Verify the app (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for app in "target/$TARGET/release/bundle/macos/"*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            lipo -archs "$app/Contents/MacOS/"*
            if [ "${MACOS_NOTARIZE:-no}" = yes ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=4 "$app"
            fi
          done

      - name: Forget the signing material (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Windows signing, skipped without the secrets (the suite's model step).
      - name: Sign the Windows installer
        if: runner.os == 'Windows' && env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($f in Get-ChildItem target/release/bundle/nsis/*.exe) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx

      - name: Collect bundles under version-free names
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then root="target/$TARGET/release/bundle"; else root="target/release/bundle"; fi
          mkdir -p dist updater
          one() { # exactly one file matches $1; copy it to dist/$2
            # No mapfile: the Mac runner's /bin/bash is 3.2, which lacks it (v0.1.0's first
            # build failed here). $1 is left unquoted so the shell expands the pattern; each
            # match stays one word even with spaces in the file name.
            local found=() f
            for f in $1; do [ -e "$f" ] && found+=("$f"); done
            if [ "${#found[@]}" -ne 1 ]; then echo "::error::Expected one $1, found ${#found[@]}."; exit 1; fi
            cp "${found[0]}" "dist/$2"
          }
          case "$RUNNER_OS" in
            macOS)
              one "$root/dmg/*.dmg" Method-Schedule-macOS.dmg
              # The updater archive and its signature, named as latest.json expects (no
              # spaces: the name is the download address).
              if [ "${UPDATER:-no}" = yes ]; then
                name="Method-Schedule_${GITHUB_REF_NAME#v}_aarch64.app.tar.gz"
                one "$root/macos/*.app.tar.gz" "$name"
                one "$root/macos/*.app.tar.gz.sig" "$name.sig"
                mv "dist/$name" "dist/$name.sig" updater/
              fi
              ;;
            Windows) one "$root/nsis/*.exe" Method-Schedule-windows-x64-setup.exe ;;
            Linux)
              one "$root/deb/*.deb" Method-Schedule-linux-amd64.deb
              one "$root/appimage/*.AppImage" Method-Schedule-linux-x86_64.AppImage
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS'
        with:
          name: updater-${{ matrix.name }}
          path: updater/*
          if-no-files-found: ignore
          retention-days: 30

  draft:
    name: draft release
    # The only job with write access: it drafts the release with the notes and the bundles.
    # Publishing the draft is left to a person.
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true
      - name: Update manifest
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p updater
          if [ -n "$(ls -A updater)" ]; then
            python3 scripts/update-manifest.py --dir updater --version "${TAG#v}" --out updater/latest.json
            cp updater/* dist/
          else
            echo "::notice::No updater archive in this release: no latest.json, so installed apps won't see it (decision 213)."
          fi
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/releases/$version.md" ]; then
            # The note's pictures are relative to docs/releases/; a release page needs
            # them as addresses of the tagged files.
            sed "s#](\.\./\.\./#](https://github.com/$GITHUB_REPOSITORY/raw/$TAG/#g" \
              "docs/releases/$version.md" > "$notes"
          else
            echo "Draft: write docs/releases/$version.md from the decisions since the last tag before publishing." > "$notes"
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              "${prerelease[@]}" --title "Method Schedule $version" --notes-file "$notes"
          fi
