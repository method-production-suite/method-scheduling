[workspace]
resolver = "2"
# Crate names follow the product name, Method Schedule (decisions.md, entry 27).
members = [
    "crates/method-schedule-core",
    "crates/method-schedule-format",
    "crates/method-schedule-cli",
    "crates/method-schedule-session",
    "crates/method-schedule-app",
    "crates/method-schedule-web",
    "crates/xtask",
]

[workspace.package]
edition = "2021"
# The one place the version lives: every crate inherits it.
version = "0.8.0"
license = "MIT OR Apache-2.0"

# Every third-party crate is pinned to one exact version, here and only here (each crate
# says `{ workspace = true }`), so a bump edits one line. Crate ages: at least 14 days
# (scripts/check-crate-ages.py).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri-build = { version = "=2.7.2", features = [] }
tauri = { version = "=2.12.2", default-features = false, features = ["wry", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false }
semver = "=1.0.28"
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

# Smaller dev builds (suite disk rules, 2026-10-21): line tables for our own crates' panics
# and backtraces, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The browser build (`cargo xtask web`): small over fast.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
