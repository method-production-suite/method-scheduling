[workspace]
resolver = "2"
# Crate names follow the product name, Method Schedule (decisions.md, entry 27).
members = [
    "crates/method-schedule-core",
    "crates/method-schedule-format",
    "crates/method-schedule-cli",
    "crates/method-schedule-session",
    "crates/method-schedule-app",
    "crates/method-schedule-web",
    "crates/xtask",
]

[workspace.package]
edition = "2021"
# The one place the version lives: every crate inherits it.
version = "0.5.0"
license = "MIT OR Apache-2.0"

# Smaller dev builds (suite disk rules, 2026-10-21): line tables for our own crates' panics
# and backtraces, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The browser build (`cargo xtask web`): small over fast.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
