# cargo deny check: known advisories, licenses and crate sources (the `deny`
# job in .github/workflows/ci.yml runs it on every push).

[advisories]
# Every advisory fails, unmaintained and unsound ones included, unless it is
# listed here with the reason it does not apply.
ignore = [
    # Unmaintained, no fix upstream; reached only through Tauri (gtk's macros on
    # Linux; urlpattern in tauri-utils). Drop each when Tauri moves off it.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro under Tauri's gtk crates" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: via urlpattern in tauri-utils" },
    # rustls 0.23.45, reached only through the updater's HTTPS client (reqwest via
    # tauri-plugin-updater's rustls-tls), with rustls's ring, std and tls12 features
    # and the ring provider the updater installs. None of the four applies, checked
    # against each advisory on 2026-10-18 (also true of the published 0.1.0, same lock);
    # take 0.23.46 when it clears the crate cooldown.
    { id = "RUSTSEC-2026-0346", reason = "Debug of client session values: only custom ClientSessionStore impls that format them; reqwest uses rustls's built-in cache and nothing here implements one" },
    { id = "RUSTSEC-2026-0347", reason = "data sent after an ECH rejection: only with EchMode::Enable, which nothing in reqwest, hyper-rustls, the updater or this code sets" },
    { id = "RUSTSEC-2026-0348", reason = "Brotli certificate decompression: only with rustls's brotli feature, which is not enabled (ring, std, tls12 only)" },
    { id = "RUSTSEC-2026-0349", reason = "downgrade from X25519MLKEM768: the ring provider offers only X25519, P-256 and P-384, so there is no post-quantum group to downgrade from" },
]

[licenses]
# Everything we ship must be compatible with distributing Method Schedule under
# MIT OR Apache-2.0. This is the list the dependency tree actually needs; a new
# license fails CI until someone has looked at it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-root-certs: the Mozilla root certificate list as data (the updater).
    "CDLA-Permissive-2.0",
    # File-level copyleft, unmodified (cssparser, selectors, dtoa-short via
    # Tauri; option-ext via dirs). Fine to ship alongside MIT/Apache code.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common under Tauri; worth seeing, not worth failing.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
